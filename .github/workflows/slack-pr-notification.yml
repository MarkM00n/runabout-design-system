name: Slack PR notification

# Three independent gates decide whether this actually posts to Slack:
#
# 1. Draft state (job-level `if`, below): only `ready_for_review` and
#    `synchronize` on a non-draft PR run this job at all. A freshly opened
#    PR (draft or not) and a draft that gets new commits stay between the
#    author and CI — the channel only ever sees PRs that want a reviewer.
#
# 2. Check status (step-level `if` on "Post to Slack", below): design-sync
#    failing means nothing posts, full stop — it stays with the author on
#    the PR until green. Clean pass or pass-with-warnings both post; a
#    warning is "safe to merge, noted, not blocking," never a reason to
#    withhold the ping.
#
# 3. Design-relevance (step-level `if` on "Post to Slack", below): a PR that
#    touches no src/components/ file and whose validation report entries are
#    all identical to base (tooling, CI, docs, unrelated app code) has
#    nothing design-system-related to report. Posting here would fall back
#    to the whole repo's current status — attaching other components'
#    pre-existing warnings to a PR that never touched them, exactly the
#    confusion component-scoping exists to prevent — so it's skipped
#    entirely rather than shown as a whole-design-system message.
#
# Gates 2 and 3 are check-result / diff-content gates, not a git-mergeability
# one — a PR with a merge conflict is a separate git state GitHub already
# surfaces on the PR itself, and isn't inspected anywhere in this workflow.
on:
  pull_request:
    types: [ready_for_review, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  notify:
    # ready_for_review always has draft == false by the time this fires, so
    # this one check covers both trigger types: notify on the transition to
    # ready, and on later commits as long as the PR is still (or now) ready.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the PR's base commit reachable to diff against and to check
          # whether a touched component's directory existed before this PR.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Informational, same as validation-report-comment.yml: a PR that
      # intentionally introduces a FAIL shouldn't break this notification.
      - name: Run design-sync
        continue-on-error: true
        run: npm run design-sync

      - name: Find existing validation report comment
        id: validation_comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq '[.[] | select(.body | test("Design System Validation Report"))] | last | .html_url // empty')
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Build Slack payload
        id: build_payload
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_ADDITIONS: ${{ github.event.pull_request.additions }}
          PR_DELETIONS: ${{ github.event.pull_request.deletions }}
          PR_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TRIGGER_EVENT: ${{ github.event.action }}
          VALIDATION_COMMENT_URL: ${{ steps.validation_comment.outputs.url }}
        # Direct node invocation, not `npm run` — see format-validation-comment.js's
        # step in validation-report-comment.yml for why (npm's banner would land in
        # the payload body verbatim).
        run: node scripts/format-slack-notification.js > /tmp/slack-payload.json

      # design-sync failing is a check-result gate, not a git-mergeability
      # gate — a PR can fail this and still be perfectly mergeable, or pass
      # this and still have a merge conflict GitHub flags separately. This
      # step only ever looks at check status.
      - name: Checks failing — hold for the author
        if: steps.build_payload.outputs.status == 'fail'
        run: echo "::notice::design-sync is failing for this PR's touched component(s) — not posting to Slack. Stays with the author on the PR until it's green."

      - name: No design components touched — skipping
        if: steps.build_payload.outputs.should_post != 'true'
        run: echo "::notice::This PR doesn't touch any design system component, directly or via its validation report entry — not posting to Slack. Nothing design-relevant to report."

      # The two notice steps above only ever show up in the Actions log —
      # invisible to anyone waiting on the Slack ping itself. This mirrors
      # that same reasoning as a PR comment instead, so a skip is visible
      # right where the author or reviewer is actually looking. Scoped
      # narrowly: only fires when a skip happens, never touches the
      # ready_for_review trigger or the conditions the real Slack post
      # above (or below) fires on.
      - name: Determine Slack skip reason
        id: skip_reason
        run: |
          if [ "${{ steps.build_payload.outputs.should_post }}" != "true" ]; then
            reason="This PR doesn't touch any design system component, directly or via its validation report entry — nothing design-relevant to announce in Slack."
          elif [ "${{ steps.build_payload.outputs.status }}" == "fail" ]; then
            reason="design-sync is failing for this PR's touched component(s) — the Slack notification stays held until it's green."
          else
            reason=""
          fi
          {
            echo "reason<<SKIP_REASON_EOF"
            echo "$reason"
            echo "SKIP_REASON_EOF"
          } >> "$GITHUB_OUTPUT"

      # Content-marker lookup, not `gh pr comment --edit-last` — that
      # shortcut finds the *authenticated actor's* last comment on the PR
      # regardless of which workflow posted it, and validation-report-
      # comment.yml posts its own sticky comment as the same bot identity.
      # This was `--edit-last` originally and verifiably clobbered
      # validation-report-comment.yml's comment on 2026-08-05 when both
      # workflows fired on the same push — see that workflow's own
      # "Find existing validation report comment" step, fixed the same way
      # once the collision was caught live. Searching by our own marker is
      # what keeps the two sticky comments independent.
      - name: Find existing Slack-skip comment
        id: skip_comment
        if: steps.skip_reason.outputs.reason != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq '[.[] | select(.body | test("<!-- slack-notification-skip -->"))] | last | .id // empty')
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Post or update Slack-skip notice
        if: steps.skip_reason.outputs.reason != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_REASON: ${{ steps.skip_reason.outputs.reason }}
          COMMENT_ID: ${{ steps.skip_comment.outputs.id }}
        # Built line-by-line via echo, not a multi-line quoted string — the
        # latter keeps this script's own YAML indentation as literal leading
        # spaces on lines 2+, which GitHub Markdown reads as a code block.
        # `-F` (typed field), not `-f` (raw-field) — only `-F` reads `@file`
        # as file content; `-f` treats "@/tmp/skip-comment.md" as a literal
        # string value, which is what an earlier version of this step
        # actually posted as the comment body.
        run: |
          {
            echo "<!-- slack-notification-skip -->"
            echo "**Slack notification skipped**"
            echo ""
            echo "$SKIP_REASON"
          } > /tmp/skip-comment.md
          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/$COMMENT_ID" -X PATCH -F body=@/tmp/skip-comment.md
          else
            gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" -X POST -F body=@/tmp/skip-comment.md
          fi

      - name: Post to Slack
        if: steps.build_payload.outputs.status != 'fail' && steps.build_payload.outputs.should_post == 'true'
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        # The notification is informational, never a merge gate — a missing
        # secret, a bad webhook, or Slack being down must not fail the workflow.
        run: |
          if [ -z "$SLACK_WEBHOOK" ]; then
            echo "::warning::SLACK_WEBHOOK secret is not set — skipping Slack notification. See docs/how-work-flows.md for setup."
            exit 0
          fi
          status_code=$(curl -sS -o /tmp/slack-response.txt -w '%{http_code}' \
            -X POST -H 'Content-type: application/json' \
            --data-binary @/tmp/slack-payload.json \
            "$SLACK_WEBHOOK" || echo "000")
          if [ "$status_code" != "200" ]; then
            echo "::warning::Slack notification failed (HTTP $status_code): $(cat /tmp/slack-response.txt 2>/dev/null)"
          else
            echo "Slack notification posted."
          fi
