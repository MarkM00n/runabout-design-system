<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />

    <title>Vines &amp; Vinyl — Sat 24 April 2027, Eltham</title>
    <meta
      name="description"
      content="A tasting afternoon with independent makers and guest DJs. Sign up for first access to early-bird tickets in January."
    />
    <!-- Meta pixel 39999404559705274 — standard base code, PageView on load.
         Loads on the live domain only, so local and preview builds don't
         send test traffic. autoConfig off: the pixel doesn't scan the page
         or its form fields, so no email or other personal data goes to
         Meta. Lead fires from submitSignup.ts after /api/subscribe returns
         OK. Disclosed in the footer (docs/vines-and-vinyl-copy.md). -->
    <script>
      if (location.hostname === 'vinesandvinyl.runaboutwine.com.au') {
        !(function (f, b, e, v, n, t, s) {
          if (f.fbq) return;
          n = f.fbq = function () {
            n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments);
          };
          if (!f._fbq) f._fbq = n;
          n.push = n;
          n.loaded = !0;
          n.version = '2.0';
          n.queue = [];
          t = b.createElement(e);
          t.async = !0;
          t.src = v;
          s = b.getElementsByTagName(e)[0];
          s.parentNode.insertBefore(t, s);
        })(window, document, 'script', 'https://connect.facebook.net/en_US/fbevents.js');
        fbq('set', 'autoConfig', false, '39999404559705274');
        fbq('init', '39999404559705274');
        fbq('track', 'PageView');
      }
    </script>
    <link rel="canonical" href="https://vinesandvinyl.runaboutwine.com.au/" />

    <!-- Link previews (iMessage, WhatsApp, Slack, Facebook, LinkedIn, X).
         og:image is a 1200×630 crop of the hero — photo, lock-up and date
         seal — rendered from the page itself (landing/public/og-image.jpg).
         Absolute URLs: scrapers don't resolve relative ones. Copy from
         docs/vines-and-vinyl-copy.md. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vines &amp; Vinyl" />
    <meta property="og:locale" content="en_AU" />
    <meta property="og:url" content="https://vinesandvinyl.runaboutwine.com.au/" />
    <meta property="og:title" content="Vines &amp; Vinyl · Eltham · Sat 24 April 2027" />
    <meta
      property="og:description"
      content="A tasting afternoon with independent makers and guest DJs. Sign up for first access to early-bird tickets in January."
    />
    <meta property="og:image" content="https://vinesandvinyl.runaboutwine.com.au/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Vines &amp; Vinyl lock-up and date seal over a photo of the Dorian LeGallienne Room, Eltham"

    <meta name="twitter:title" content="Vines &amp; Vinyl · Eltham · Sat 24 April 2027" />
